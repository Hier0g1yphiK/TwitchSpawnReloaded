plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'maven-publish'
}

version = mod_version
group = "igoodie.twitchspawn"

base {
    archivesName = "twitchspawn_" + minecraft_version
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

configurations {
    // Non-mod libraries bundled into the final jar
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Night Config
    shade "com.electronwill.night-config:core:3.6.7"
    shade "com.electronwill.night-config:toml:3.6.7"

    // SocketIO Client
    shade "io.socket:socket.io-client:1.0.0"

    // JUnit 5 for testings
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.5.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.5.0'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

jar {
    archiveClassifier = 'slim'
}

shadowJar {
    archiveClassifier = 'dev-shadow'
    configurations = [project.configurations.shade]
    // Minecraft already ships Gson
    dependencies {
        exclude(dependency('com.google.code.gson:gson'))
    }
}

// Remap the shaded jar into the final distributable
remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
    archiveClassifier = ''
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact remapJar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

test {
    useJUnitPlatform()
}
